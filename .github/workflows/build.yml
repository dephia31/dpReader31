name: build

on:
  push:
    branches: [main, codex/metalio-s31-test30]
  pull_request:
  workflow_dispatch:

jobs:
  firmware-editions-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/firmware_editions_host_test.py
      - run: python3 tools/firmware_layout_host_test.py
      - run: python3 tools/ota_edition_choice_host_test.py
      - run: node tools/web_editions_host_test.mjs

  sleep-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Clang for sanitizer host regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dpreader-host-cc"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/dpreader-host-cc/cc"
          echo "$RUNNER_TEMP/dpreader-host-cc" >> "$GITHUB_PATH"
      - name: Materialize S31 production sources
        run: python3 tools/board_source_view.py --board metalio47 --tests --output build/sleep-host
      - name: Sleep, wake, lock, media recovery and power policy
        working-directory: build/sleep-host
        run: |
          python3 tools/metalio_sleep_host_test.py
          python3 tools/metalio_light_transaction_host_test.py
          python3 tools/metalio_deep_sleep_host_test.py
          python3 tools/metalio_poweroff_host_test.py
          python3 tools/metalio_boot_wake_host_test.py
          python3 tools/metalio_lock_key_host_test.py
          python3 tools/metalio_lock_resume_host_test.py
          python3 tools/metalio_mount_resume_host_test.py
          python3 tools/metalio_power_choice_host_test.py
          python3 tools/sleep_only_settings_host_test.py
          mkdir -p build/book-tests
          cc -std=c11 -D_DEFAULT_SOURCE -DDPREADER_BOARD_METALIO47=1 -Wall -Wextra -Werror -fsanitize=address,undefined -Itools/settings_backup_stubs -Imain tools/boot_state_host_test.c -o build/book-tests/boot-state
          build/book-tests/boot-state
  notes-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for annotation transport and Lua bridge tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcjson-dev zlib1g-dev
          python3 -m pip install lupa Pillow==13.0.0
      - name: Selection geometry, annotation recovery and StarDict
        run: |
          python3 tools/ble_identity_byte_access_host_test.py
          python3 tools/ble_lifecycle_bounded_host_test.py
          python3 tools/book_sync_position_host_test.py
          python3 tools/kosync_state_host_test.py
          python3 tools/kosync_wire_host_test.py
          mkdir -p build/book-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -Itools/ota_stubs -Imain -I/usr/include/cjson tools/ota_release_host_test.c main/ota_release.c -lcjson -o build/book-tests/ota-release
          build/book-tests/ota-release
          python3 tools/kosync_progress_host_test.py
          python3 tools/kosync_auto_host_test.py
          python3 tools/action_menu_host_test.py
          python3 tools/sleep_only_settings_host_test.py
          python3 tools/crash_report_host_test.py
          python3 tools/system_font_defaults_host_test.py
          python3 tools/ui_choice_host_test.py
          python3 tools/ui_caption_host_test.py
          python3 tools/files_bulk_ui_host_test.py
          python3 tools/settings_dialog_geometry_host_test.py
          mkdir -p build/book-tests/settings-card
          cc -std=gnu11 -DDPREADER_BOARD_METALIO47=1 -Wall -Wextra -Werror -fsanitize=undefined -Itools/settings_backup_stubs -Icomponents/read_pico_transfer/include tools/reader_settings_backup_host_test.c -o build/book-tests/reader-settings-backup
          build/book-tests/reader-settings-backup
          cc -std=gnu11 -DDPREADER_BOARD_METALIO47=1 -Wall -Wextra -Werror -fsanitize=undefined -Itools/settings_backup_stubs -Icomponents/read_pico_transfer/include tools/home_utilities_settings_host_test.c -o build/book-tests/home-utilities-settings
          build/book-tests/home-utilities-settings
          python3 tools/home_utilities_host_test.py
          python3 tools/home_utility_icons_host_test.py
          python3 tools/word_spacing_host_test.py
          python3 tools/word_spacing_settings_host_test.py
          python3 tools/reader_spacing_ranges_host_test.py
          python3 tools/dict_sd_folder_host_test.py
          python3 tools/quick_radio_notice_host_test.py
          python3 tools/metalio_psram_task_host_test.py
          python3 tools/book_dictionary_speed_host_test.py
          python3 tools/run_book_notes_tests.py
          python3 tools/koreader_notes_roundtrip_test.py
          DPREADER_BOARD=metalio47 python3 tools/ui_icon_generator_host_test.py

  display-host-tests:
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Clang for sanitizer host regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dpreader-host-cc"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/dpreader-host-cc/cc"
          echo "$RUNNER_TEMP/dpreader-host-cc" >> "$GITHUB_PATH"
      - name: Board selection and Metalio47 host-test view
        shell: bash
        run: |
          python3 tools/license_notices_host_test.py
          python3 tools/board_selection_host_test.py
          python3 tools/board_source_view.py --board metalio47 --tests --output build/host/metalio47
      - name: S31 pipeline, power and cache regressions
        shell: bash
        run: |
          python3 tools/test_s31_pipeline_lut.py
          python3 tools/test_s31_lcd_interrupt_guard.py
          python3 tools/test_s31_dma_chain.py
          python3 tools/test_s31_line_queue.py
          python3 tools/test_s31_radio_margin.py
          python3 tools/test_home_minute_present.py
          bash tools/run_metalio_cover_cache_host_test.sh
          python3 tools/board_source_view.py --board metalio47 --tests --output build/host/metalio47
          python3 build/host/metalio47/tools/metalio_vcom_host_test.py
          python3 build/host/metalio47/tools/test_glass_geometry.py
          python3 build/host/metalio47/tools/metalio_clock_cache_host_test.py
      - name: Water-turn, display recovery, navigation and waveform regressions
        shell: bash
        working-directory: build/host/metalio47
        run: |
          python3 tools/settings_layout_font_host_test.py
          bash tools/run_water_turn_host_test.sh
          bash tools/run_display_host_test.sh
          bash tools/run_display_navigation_tests.sh
          python3 tools/metalio_power_host_test.py
          python3 tools/boot_panel_actions_host_test.py
          python3 tools/lock_pin_host_test.py
          python3 tools/lock_screen_host_test.py
          python3 tools/factory_reset_host_test.py
          python3 tools/factory_reset_ui_host_test.py
          python3 tools/book_excerpt_host_test.py
          python3 tools/custom_media_dirs_host_test.py
          python3 tools/pager_host_test.py
          python3 tools/quick_layer_raster_host_test.py
          python3 tools/test_epd_difference_bounds.py --check-regression
          python3 tools/test_s31_pie_dispatch.py
          python3 tools/test_lcd_frame_lifecycle.py
          sh tools/run_app_loop_host_tests.sh
          python3 tools/reader_spacing_host_test.py
          python3 tools/test_book_toc.py
          node tools/flasher_integrity_host_test.cjs
          node tools/flasher_risk_host_test.cjs
          node tools/flasher_nvs256_host_test.cjs
          node tools/transfer_web_host_test.js
          python3 tools/vertical_punctuation_host_test.py
          python3 tools/vertical_number_host_test.py
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -Imain/book -Imain -Itools/book_layout_stubs -Itools/book_source_host_stubs tools/book_layout_host_test.c main/book/book_layout.c main/book/html_text.c -o build/book-tests/layout
          build/book-tests/layout

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [metalio47]
    # v6.1 includes both Xtensa S3 and RISC-V S31; never share their build/config directories.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the selected board package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          extra=()
          if [ "${{ matrix.board }}" = metalio47 ]; then extra=(--s31-pie --s31-text-ripple); fi
          python tools/build_firmware.py --board "${{ matrix.board }}" --edition all \
            --idf-${{ matrix.board }} "$IDF_PATH" --python "$(command -v python)" \
            --output build/boards "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build/boards/full/packages/
            build/boards/love-book/packages/

  data-protection-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backup, restore, download and test bundle regressions
        run: |
          python3 tools/auto_backup_host_test.py
          python3 tools/transfer_download_host_test.py
          python3 tools/test_test_bundle_export.py
          python3 tools/home_resume_ink_rotation_host_test.py

  board-reader-tests:
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [metalio47]
    steps:
      - uses: actions/checkout@v4
      - name: Select Clang for sanitizer host regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dpreader-host-cc"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/dpreader-host-cc/cc"
          echo "$RUNNER_TEMP/dpreader-host-cc" >> "$GITHUB_PATH"
      - name: Materialize and test reader/UI/settings for this board
        shell: bash
        run: |
          python3 tools/board_source_view.py --board "${{ matrix.board }}" --tests --output build/host/${{ matrix.board }}
          cd build/host/${{ matrix.board }}
          mkdir -p build/book-tests/settings-card
          python3 tools/book_state_files_host_test.py
          python3 tools/book_profile_host_test.py
          python3 tools/boot_file_state_host_test.py
          python3 tools/book_history_files_host_test.py
          python3 tools/reading_settings_host_test.py
          python3 tools/reader_controls_host_test.py
          python3 tools/reader_ui_scale_host_test.py
          python3 tools/reader_refresh_release_host_test.py
          python3 tools/reader_fullscreen_host_test.py
          python3 tools/lock_screen_host_test.py
          cc -std=gnu11 -Wall -Wextra -Werror -Itools/settings_backup_stubs \
            -Icomponents/read_pico_transfer/include tools/settings_backup_host_test.c -o build/settings-backup
          build/settings-backup
          sh tools/run_app_loop_host_tests.sh
          bash tools/run_display_navigation_tests.sh
