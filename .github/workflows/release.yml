name: Publish GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate official S31 release
        run: python3 tools/publish_release.py --dry-run
      - name: Upload verified draft assets and publish
        run: python3 tools/publish_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
