name: Publish web flasher

on:
  push:
    branches: [main]
    paths:
      - web/**
      - releases/**
      - metalio-s31-update.json
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and stage public flashing files
        run: |
          mkdir -p _site
          if [ -d web ]; then
            cp -r web/* _site/
          fi
          if [ -d releases ]; then
            cp -r releases _site/
            if [ -f releases/metalio-s31-update.json ]; then
              cp releases/metalio-s31-update.json _site/
            fi
            if [ -f releases/dpReader_metalio47_firmware.bin ]; then
              cp releases/dpReader_metalio47_firmware.bin _site/
            fi
            if [ -f releases/dpReader_metalio47_full.bin ]; then
              cp releases/dpReader_metalio47_full.bin _site/
            fi
          fi
          if [ -f metalio-s31-update.json ]; then
            cp metalio-s31-update.json _site/
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
