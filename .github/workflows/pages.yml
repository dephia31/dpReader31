name: Publish web flasher
on:
  push:
    branches: [main]
    paths: [web/**, releases/**, metalio-s31-update.json, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Verify published inputs
        run: python3 source/tools/verify_metalio_release.py
      - name: Check out the configured Pages source branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
      - name: Publish the allowlisted files, retaining historical releases
        shell: bash
        run: |
          cp -R source/web/. public/
          mkdir -p public/releases
          cp -R source/releases/. public/releases/
          for name in dpReader_metalio47_firmware.bin dpReader_metalio47_full.bin metalio-s31-update.json SHA256SUMS.txt; do
            if [ -f "source/releases/$name" ]; then
              cp "source/releases/$name" "public/$name"
            else
              rm -f "public/$name"
              rm -f "public/releases/$name"
            fi
          done
          for name in dpReader_metalio47_firmware.bin dpReader_metalio47_full.bin; do
            if [ ! -f "source/releases/love-book/$name" ]; then
              rm -f "public/releases/love-book/$name"
            fi
          done
          touch public/.nojekyll
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "pages: publish verified firmware from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the complete verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publish:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Web Flash and OTA
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
